
name: Build Shadow Ninja APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npm run lint

      - name: Build Web
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/android@^8.6.2 --no-save --no-package-lock
          npx cap add android
          npx cap sync android

      - name: Set Landscape
        run: |
          sed -i 's/android:screenOrientation="[^"]*"//g' android/app/src/main/AndroidManifest.xml
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Ninja-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
