
name: Build Shadow Ninja APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''
          accept-android-sdk-licenses: true

      - name: Install Android SDK packages
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check TypeScript
        run: npm run lint

      - name: Build Web Game
        run: npm run build

      - name: Setup Capacitor Android
        run: |
          npm install @capacitor/android@^8.6.2 --no-save --no-package-lock --no-audit --no-fund

          if [ ! -d android ]; then
            npx cap add android
          fi

          npx cap sync android

      - name: Set Landscape Orientation
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")

          if not manifest.is_file():
              raise SystemExit("AndroidManifest.xml tidak ditemukan")

          xml = manifest.read_text(encoding="utf-8")

          pattern = re.compile(
              r'(<activity\b[^>]*android:name="[^"]*MainActivity"[^>]*)(>)',
              re.DOTALL
          )

          match = pattern.search(xml)

          if not match:
              raise SystemExit("MainActivity tidak ditemukan")

          attrs = re.sub(
              r'\s+android:screenOrientation="[^"]*"',
              "",
              match.group(1)
          )

          replacement = (
              attrs
              + ' android:screenOrientation="sensorLandscape"'
              + match.group(2)
          )

          manifest.write_text(
              xml[:match.start()] + replacement + xml[match.end():],
              encoding="utf-8"
          )
          PY

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Shadow-Ninja-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
