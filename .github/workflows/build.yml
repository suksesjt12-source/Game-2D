name: Build Shadow Ninja Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Type check & Build web bundle
        run: |
          npm run lint
          npm run build

      - name: Install Capacitor Android platform & sync
        run: |
          npm install @capacitor/android --no-save
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Enforce Landscape Orientation & Fullscreen in AndroidManifest
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' "$MANIFEST"
          fi

      - name: Grant execute permission for Gradlew
        working-directory: android
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload Shadow Ninja APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadow-ninja-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
